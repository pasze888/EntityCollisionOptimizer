org.gradle.jvmargs=-Xmx2G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
# native-build.gradle 在配置期读取项目属性（skipNative / zigExecutable），暂不启用配置缓存。
org.gradle.configuration-cache=false

# NeoForge 26.1.2 —— 本分支是 upstream/26.1（Fabric）的 NeoForge 移植。
# Minecraft 版本必须与 Neo 版本一致，才能解析到有效的 userdev 构件。
minecraft_version=26.1.2
minecraft_version_range=[26.1.2,26.2)
neo_version=26.1.2.99
loader_version_range=[1,)
# 编译本模组用的 Java 版本；mc-mod-ci 也读这个键来决定 CI 装哪个 JDK。
java_version=25

# Mod
mod_id=entity_collision_optimizer
mod_name=Entity Collision Optimizer
mod_license=MIT
mod_authors=water2004
mod_version=1.0.0-mc26.1.2-alpha.1
maven_group=org.edtp
archives_base_name=entity_collision_optimizer-neoforge
