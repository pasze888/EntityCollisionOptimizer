name: Build

on:
  push:
    branches: [ "**" ]

permissions:
  contents: read

jobs:
  build-and-package:
    name: Build Mod
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Java 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      # 版本是硬约束：build.zig 与 src-zig 都按 Zig 0.16 的 API 写，不能漂到 0.17。
      # 不用自建下载脚本：ziglang.org 偶发卡住时自建脚本会静默挂死（无输出、无超时），
      # 这个 action 带重试与镜像回退。
      - name: Setup Zig 0.16.0
        uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # 仓库里的 gradlew 模式是 100644，Linux 上必须自己补可执行位。
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build project
        run: ./gradlew build --stacktrace

      - name: Check release scripts
        shell: pwsh
        run: ./.github/scripts/test-release.ps1

      - name: Run contract and unit GameTests
        run: ./gradlew runGameTestUnit --stacktrace

      - name: Record vanilla baseline traces
        run: ./gradlew -p vanilla-gametest runGameTestServer --stacktrace

      - name: Run cross-process integration GameTests
        run: ./gradlew runGameTestIntegration --stacktrace

      - name: Compute artifact name
        shell: pwsh
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          # 分支名可以带斜杠（neoforge/26.1.2），artifact 名称不允许，先替换成短横线。
          $ref = $env:REF_NAME -replace '[^A-Za-z0-9._-]', '-'
          "name=EntityCollisionOptimizer-$ref-build-${{ github.run_number }}" >> $env:GITHUB_OUTPUT
        id: artifact-name

      - name: Upload Mod artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.artifact-name.outputs.name }}
          path: build/libs/*.jar
          retention-days: 14
