plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.146'
}

def releaseVersion = providers.gradleProperty("releaseVersion")
        .orElse(providers.gradleProperty("mod_version"))
        .get()
def numericIdentifier = /(?:0|[1-9][0-9]*)/
def minecraftIdentifier = /[0-9]+(?:\.[0-9]+)+/
def semanticVersion = /${numericIdentifier}\.${numericIdentifier}\.${numericIdentifier}/
def stableVersionPattern = ~/^${semanticVersion}\+mc(${minecraftIdentifier})$/
def prereleaseVersionPattern = ~/^${semanticVersion}-mc(${minecraftIdentifier})-alpha\.${numericIdentifier}$/
def stableVersionMatch = releaseVersion =~ stableVersionPattern
def prereleaseVersionMatch = releaseVersion =~ prereleaseVersionPattern
def isStableVersion = stableVersionMatch.matches()
def isPrereleaseVersion = prereleaseVersionMatch.matches()

if (!isStableVersion && !isPrereleaseVersion) {
    throw new GradleException(
            "Invalid mod version '${releaseVersion}'. Expected X.Y.Z+mc${minecraft_version} "
                    + "or X.Y.Z-mc${minecraft_version}-alpha.N"
    )
}

def targetMinecraftVersion = isStableVersion
        ? stableVersionMatch.group(1)
        : prereleaseVersionMatch.group(1)
if (targetMinecraftVersion != minecraft_version.toString()) {
    throw new GradleException(
            "Mod version '${releaseVersion}' targets Minecraft ${targetMinecraftVersion}, "
                    + "but minecraft_version is ${minecraft_version}"
    )
}

version = releaseVersion
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    mavenCentral()
}

def unitTestsEnabled = providers.gradleProperty("unitTest").isPresent()
def integrationTestsEnabled = providers.gradleProperty("integrationTest").isPresent()
def benchmarksEnabled = providers.gradleProperty("benchmark").isPresent()
def enabledTestSuites = ((unitTestsEnabled ? 1 : 0)
        + (integrationTestsEnabled ? 1 : 0)
        + (benchmarksEnabled ? 1 : 0))

if (enabledTestSuites > 1) {
    throw new GradleException("Choose exactly one GameTest suite: unitTest, integrationTest, or benchmark")
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(project.java_version)
    withSourcesJar()
}

tasks.withType(JavaCompile).configureEach {
    options.release = project.java_version as int
    options.encoding = 'UTF-8'
}

dependencies {
    if (providers.gradleProperty("compatModsDir").isPresent()) {
        runtimeOnly fileTree(
                dir: providers.gradleProperty("compatModsDir").get(),
                include: ["*.jar"]
        )
    }
}

neoForge {
    version = project.neo_version

    runs {
        client {
            client()
        }
        server {
            server()
            programArgument '--nogui'
        }
        gameTestServer {
            type = 'gameTestServer'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }
        configureEach {
            // FFM 需要显式开启原生访问。FML 把 mod 放进子 ModuleLayer，
            // boot 层（含 MDG 自带的这条）的 --enable-native-access 对子层模块不生效，
            // 因此开发运行时仍会打印一次 native-access 警告；Java 25 允许该调用，模组继续工作。
            // 仍按 mod id 追加一条，供将来 mod 落在 boot 层（或用户自行启动）时生效。
            jvmArgument '--enable-native-access=ALL-UNNAMED'
            jvmArgument "--enable-native-access=${project.mod_id}"
            if (benchmarksEnabled) {
                jvmArgument '-Dentity_collision_optimizer.runBenchmark=true'
            }
            if (providers.gradleProperty("jfrOutput").isPresent()) {
                jvmArgument "-XX:StartFlightRecording=filename=${file(providers.gradleProperty('jfrOutput').get()).absolutePath},settings=profile,dumponexit=true"
            }
            // 可选本地 profiler，仅用于手工实验；绝不打包或注入 Gradle 本身。
            if (providers.gradleProperty("jitMapAgent").isPresent()) {
                def agent = file(providers.gradleProperty("jitMapAgent").get()).absolutePath
                def output = file(providers.gradleProperty("jitMapOutput").get()).absolutePath
                jvmArgument "-agentpath:${agent}=${output}"
            }
            logLevel = org.slf4j.event.Level.INFO
        }
    }

    mods {
        "${project.mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

// 模板与产物统一按 UTF-8 处理：默认取平台字符集，GBK 下会把模板里的非 ASCII 内容写坏成非法 UTF-8 字节，
// FML 解析 neoforge.mods.toml 失败时会报 "is not a valid mod file"。
var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
    ]
    inputs.properties replaceProperties
    filteringCharset = 'UTF-8'
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}
sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

tasks.named('jar', Jar) {
    from("LICENSE") {
        rename { "${it}_${archives_base_name}" }
    }
}

publishing {
    publications {
        create("mavenJava", MavenPublication) {
            from components.java
        }
    }
}

def cppScript = file('cpp-build.gradle')
if (cppScript.exists()) {
    apply from: cppScript
}
