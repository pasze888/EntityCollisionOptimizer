plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.146'
}

def releaseVersion = providers.gradleProperty("releaseVersion")
        .orElse(providers.gradleProperty("mod_version"))
        .get()
def numericIdentifier = /(?:0|[1-9][0-9]*)/
def minecraftIdentifier = /[0-9]+(?:\.[0-9]+)+/
def semanticVersion = /${numericIdentifier}\.${numericIdentifier}\.${numericIdentifier}/
def stableVersionPattern = ~/^${semanticVersion}\+mc(${minecraftIdentifier})$/
def prereleaseVersionPattern = ~/^${semanticVersion}-mc(${minecraftIdentifier})-alpha\.${numericIdentifier}$/
def stableVersionMatch = releaseVersion =~ stableVersionPattern
def prereleaseVersionMatch = releaseVersion =~ prereleaseVersionPattern
def isStableVersion = stableVersionMatch.matches()
def isPrereleaseVersion = prereleaseVersionMatch.matches()

if (!isStableVersion && !isPrereleaseVersion) {
    throw new GradleException(
            "Invalid mod version '${releaseVersion}'. Expected X.Y.Z+mc${minecraft_version} "
                    + "or X.Y.Z-mc${minecraft_version}-alpha.N"
    )
}

def targetMinecraftVersion = isStableVersion
        ? stableVersionMatch.group(1)
        : prereleaseVersionMatch.group(1)
if (targetMinecraftVersion != minecraft_version.toString()) {
    throw new GradleException(
            "Mod version '${releaseVersion}' targets Minecraft ${targetMinecraftVersion}, "
                    + "but minecraft_version is ${minecraft_version}"
    )
}

version = releaseVersion
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    mavenCentral()
}

def benchmarksEnabled = providers.gradleProperty("benchmark").isPresent()

// 上游用 -PunitTest / -PintegrationTest 让 Loom 的 runGameTest 选套件；这里套件由 run 任务本身
// 决定（runGameTestUnit / runGameTestIntegration / runGameTestBenchmark），那两个属性不再产生任何
// 效果。它们很可能是 CI 或脚本传进来的，静默忽略等于"以为跑了其实没跑"，所以直接失败。
["unitTest", "integrationTest"].each { legacyProperty ->
    if (providers.gradleProperty(legacyProperty).isPresent()) {
        throw new GradleException(
                "-P${legacyProperty} 在本分支无效。请改用对应的 run 任务："
                        + "runGameTestUnit / runGameTestIntegration / runGameTestBenchmark。"
                        + "基准套件另外需要 -Pbenchmark。")
    }
}

// Fabric 用三个 Loom 子项目分别承载契约、跨进程集成与基准测试；NeoForge 这边改为同一工程内的
// 源集：gametest 是公共测试代码与 mixin，unitTest / benchmarkTest 各带自己的测试实例清单。
// 它们都不进入发布产物：只有 processResources / jar 所属的 main 会被打包。
// 用 Gradle 的默认目录约定（<name>/java、<name>/resources），不要再 srcDir 一遍：
// 自定义源集只是加一个根，默认布局仍然是 src/<name>/java 与 src/<name>/resources。
sourceSets {
    gametest
    unitTest
    integrationTestShared
    integrationTest
}

// 集成套件的场地/追踪代码要与 vanilla 对照工程共用：两边都把同一个目录加进主源集，
// 保证录基线的那份字节码和比对时的那份完全一致。
configurations {
    integrationTestImplementation.extendsFrom integrationTestSharedImplementation
}

// 基准测试源集留到移植 benchmark 套件时再加：现在 src/benchmarkTest 只有元数据，没有 java。
// sourceSets { benchmarkTest { java.srcDir 'src/benchmarkTest/java'; resources.srcDir 'src/benchmarkTest/resources' } }

configurations {
    integrationTestImplementation.extendsFrom integrationTestSharedImplementation
}

// 测试代码要读主模组内部状态（mixin invoker、native 契约），必须看到 main 的编译产物。
// 用 compileOnly 而非 implementation：主模组的类在开发运行时由同一个类加载器提供，
// 打进测试源集反而会制造重复类。
['gametest', 'unitTest', 'integrationTestShared', 'integrationTest'].each { testSourceSetName ->
    dependencies.add("${testSourceSetName}CompileOnly", sourceSets.main.output)
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(project.java_version)
    withSourcesJar()
}

tasks.withType(JavaCompile).configureEach {
    options.release = project.java_version as int
    options.encoding = 'UTF-8'
}

dependencies {
    if (providers.gradleProperty("compatModsDir").isPresent()) {
        runtimeOnly fileTree(
                dir: providers.gradleProperty("compatModsDir").get(),
                include: ["*.jar"]
        )
    }
}

// 手工调试时可用 -PgametestArgs="--tests entity_collision_optimizer:foo" 只跑一部分用例。
def gametestArgs = providers.gradleProperty("gametestArgs")
        .map { it.split(' ').findAll { arg -> !arg.isEmpty() }.toList() }
        .orElse([] as List<String>)

// 跨进程对照的 trace 目录：vanilla 子工程录基线，本工程按同一路径比对。
// 默认落在 build/ 下（gitignore 已覆盖），可用 -PintegrationTraceDir=<绝对路径> 覆盖。
def gateTraceDir = providers.gradleProperty("integrationTraceDir")
        .map { file(it).absolutePath }
        .getOrElse(layout.buildDirectory.dir('gametest-traces').get().asFile.absolutePath)

neoForge {
    version = project.neo_version

    runs {
        client {
            client()
        }
        server {
            server()
            programArgument '--nogui'
        }
        // 跑全部已注册的测试实例；用 -PgametestArgs='--tests <选择器>' 只跑一部分。
        gameTestServer {
            type = 'gameTestServer'
            programArguments.addAll(gametestArgs)
        }
        // 契约/单元套件。
        gameTestUnit {
            type = 'gameTestServer'
            programArgument '--tests'
            programArgument "${project.mod_id}:unit_*"
        }
        // 基准套件：只在 -Pbenchmark 时真正测速（否则用例立即通过，不产生数字）。
        gameTestBenchmark {
            type = 'gameTestServer'
            jvmArgument "-Dentity_collision_optimizer.gametest.suite=benchmark"
            if (benchmarksEnabled) {
                jvmArgument '-Dentity_collision_optimizer.runBenchmark=true'
            }
            programArgument '--tests'
            programArgument "${project.mod_id}:benchmark_*"
        }
        // 跨进程集成套件：与 vanilla 基线逐字节比对（基线由 vanilla-gametest 子工程录制）。
        gameTestIntegration {
            type = 'gameTestServer'
            jvmArgument "-Dentity_collision_optimizer.gametest.suite=integration"
            jvmArgument "-Dentity_collision_optimizer.integration.mode=compare"
            jvmArgument "-Dentity_collision_optimizer.integration.trace_dir=${gateTraceDir}"
            programArgument '--tests'
            programArgument "${project.mod_id}:integration_*"
        }
        configureEach {
            // FFM 需要显式开启原生访问。FML 把 mod 放进子 ModuleLayer，
            // boot 层（含 MDG 自带的这条）的 --enable-native-access 对子层模块不生效，
            // 因此开发运行时仍会打印一次 native-access 警告；Java 25 允许该调用，模组继续工作。
            // 仍按 mod id 追加一条，供将来 mod 落在 boot 层（或用户自行启动）时生效。
            jvmArgument '--enable-native-access=ALL-UNNAMED'
            jvmArgument "--enable-native-access=${project.mod_id}"
            if (benchmarksEnabled) {
                jvmArgument '-Dentity_collision_optimizer.runBenchmark=true'
            }
            if (providers.gradleProperty("jfrOutput").isPresent()) {
                jvmArgument "-XX:StartFlightRecording=filename=${file(providers.gradleProperty('jfrOutput').get()).absolutePath},settings=profile,dumponexit=true"
            }
            // 可选本地 profiler，仅用于手工实验；绝不打包或注入 Gradle 本身。
            if (providers.gradleProperty("jitMapAgent").isPresent()) {
                def agent = file(providers.gradleProperty("jitMapAgent").get()).absolutePath
                def output = file(providers.gradleProperty("jitMapOutput").get()).absolutePath
                jvmArgument "-agentpath:${agent}=${output}"
            }
            logLevel = org.slf4j.event.Level.INFO
        }
    }

    // MDG 只给 main 自动挂 Minecraft/NeoForge 依赖，测试源集要自己声明一次；
    // 同一份 userdev 构件已由 main 拉取，这里只是把它加到测试的编译/运行时类路径上。
    addModdingDependenciesTo(sourceSets.gametest)
    addModdingDependenciesTo(sourceSets.unitTest)
    addModdingDependenciesTo(sourceSets.integrationTestShared)
    addModdingDependenciesTo(sourceSets.integrationTest)

    // 测试实例由测试源集提供：gametest 是公共测试代码与 mixin，unitTest 带自己那份清单。
    // 它们不参与 jar 打包，只在开发运行时进入 mod 的类路径。
    mods {
        "${project.mod_id}" {
            sourceSet(sourceSets.main)
            sourceSet(sourceSets.gametest)
            sourceSet(sourceSets.unitTest)
            sourceSet(sourceSets.integrationTestShared)
            sourceSet(sourceSets.integrationTest)
        }
    }
}

// 模板与产物统一按 UTF-8 处理：默认取平台字符集，GBK 下会把模板里的非 ASCII 内容写坏成非法 UTF-8 字节，
// FML 解析 neoforge.mods.toml 失败时会报 "is not a valid mod file"。
var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
    ]
    inputs.properties replaceProperties
    filteringCharset = 'UTF-8'
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}
sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

tasks.named('jar', Jar) {
    from("LICENSE") {
        rename { "${it}_${archives_base_name}" }
    }
}

publishing {
    publications {
        create("mavenJava", MavenPublication) {
            from components.java
        }
    }
}

apply from: 'native-build.gradle'
